# This is a Databricks asset bundle definition for sample.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sample

variables:
  default_pipeline_catalog:
    description: "Default catalog for pipelines"
  default_pipeline_schema:
    description: "Default schema for pipelines"

include:
  # User-managed resource files (shared across all environments)
-   resources/*.yml
-   resources/lhp/*.yml

targets:
  # ⚠️ IMPORTANT: Target names MUST match your LHP substitution environment names
  # - Each target name should have a corresponding substitutions/{env}.yaml file
  # LHP automatically adds environment-specific variables to each corresponding target below.
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4bd1933e-a83a.cloud.databricks.com/
      root_path: ~/.bundle/${bundle.name}/${bundle.target}


    variables:
      default_pipeline_catalog: pilotws
      default_pipeline_schema: pilotschema
